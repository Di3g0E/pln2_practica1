[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gia_nlp2_practica1"
version = "0.1"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "kagglehub",
    "transformers",
    "torch",
    "ipykernel"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.package-dir]
"" = "src"
